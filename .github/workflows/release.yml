name: Release

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: PS5 payload SDK tag (empty = latest)
        required: false
        type: string
      release_tag:
        description: Existing release tag to refresh (empty = Actions artifacts only)
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install the payload toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file unzip tar tcl gnupg ca-certificates
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-18 main" |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          echo "LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Check the version
        run: |
          version="$(cat VERSION)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

      - name: Resolve the latest PS5 payload SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ inputs.sdk_tag }}
        run: node scripts/latest-sdk.mjs

      - name: Install the PS5 payload SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ps5-payload-sdk.zip" "$SDK_URL"
          echo "$SDK_SHA256  $RUNNER_TEMP/ps5-payload-sdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ps5-payload-sdk/bin/prospero-clang" --version

      - name: Build the payload
        run: make payload

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ps5-payload
          path: dist/coredump-dumper-v*.elf

  release:
    needs: [payload]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ps5-payload
          path: release-assets

      - name: Verify the release tag
        if: inputs.release_tag != ''
        run: |
          expected="v$(cat VERSION)"
          if [ "${{ inputs.release_tag }}" != "$expected" ]; then
            echo "input release_tag must be $expected" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "CoreDump Dumper $TAG" --generate-notes
          mapfile -t files < <(find release-assets -type f -name '*.elf' -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release assets were downloaded" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
